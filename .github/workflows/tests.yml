name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the generated schemas match schemas/clickless.schema.json
        run: pnpm gen && git diff --exit-code packages/core/src/schemas.gen.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @clickless/react build
